<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIVC · Grade de Horários 2026/2</title>
<style>
:root{
  --green-900:#123829; --green-800:#194d38; --green-700:#1f6b46;
  --green-600:#2e8b57; --green-500:#3a9d67; --green-100:#e7f1ea;
  --green-050:#f2f8f4; --ink:#16231d; --muted:#5d6d64;
  --line:#dbe7e0; --white:#ffffff; --amber:#b7791f;
  --shadow:0 1px 2px rgba(18,56,41,.06),0 8px 24px rgba(18,56,41,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink); background:var(--green-050);
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:Georgia,"Times New Roman",serif}

/* Header */
header{
  background:linear-gradient(135deg,var(--green-900),var(--green-700));
  color:#fff; padding:20px 24px; position:sticky; top:0; z-index:50;
  box-shadow:0 4px 20px rgba(18,56,41,.18);
}
.hbar{max-width:1280px; margin:0 auto; display:flex; align-items:center; gap:20px; flex-wrap:wrap}
.logo-chip{background:#fff; border-radius:10px; padding:8px 12px; display:flex; align-items:center; box-shadow:var(--shadow)}
.logo-chip img{height:38px; display:block}
.htext h1{margin:0; font-size:20px; font-weight:700; letter-spacing:.2px}
.htext p{margin:2px 0 0; font-size:13px; opacity:.85}
.hspace{flex:1}
.sem-badge{background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25);
  padding:6px 14px; border-radius:999px; font-size:13px; font-weight:600; letter-spacing:.3px}

/* Tabs */
.tabs{max-width:1280px; margin:18px auto 0; padding:0 24px; display:flex; gap:8px}
.tab{background:transparent; border:none; padding:11px 20px; font-size:14px; font-weight:600;
  color:var(--muted); cursor:pointer; border-radius:10px 10px 0 0; position:relative}
.tab.active{color:var(--green-800); background:var(--white)}
.tab.active::after{content:""; position:absolute; left:16px; right:16px; bottom:-1px; height:3px;
  background:var(--green-600); border-radius:3px}

main{max-width:1280px; margin:0 auto; padding:0 24px 60px}
.panel{background:var(--white); border:1px solid var(--line); border-radius:0 14px 14px 14px;
  box-shadow:var(--shadow); padding:22px}

/* Stats */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px}
.stat{background:var(--white); border:1px solid var(--line); border-left:4px solid var(--green-600);
  border-radius:12px; padding:16px 18px; box-shadow:var(--shadow)}
.stat .n{font-size:30px; font-weight:800; color:var(--green-800); line-height:1}
.stat .l{font-size:12.5px; color:var(--muted); margin-top:6px; text-transform:uppercase; letter-spacing:.6px}

/* Filters */
.filters{display:grid; grid-template-columns:1.6fr repeat(5,1fr); gap:12px; margin-bottom:18px}
.field label{display:block; font-size:11px; font-weight:700; color:var(--muted);
  text-transform:uppercase; letter-spacing:.6px; margin-bottom:5px}
.field input,.field select{width:100%; padding:10px 12px; border:1.5px solid var(--line);
  border-radius:9px; font-size:14px; font-family:inherit; color:var(--ink); background:var(--white)}
.field input:focus,.field select:focus{outline:none; border-color:var(--green-600);
  box-shadow:0 0 0 3px var(--green-100)}
.searchwrap{position:relative}
.searchwrap input{padding-left:36px}
.searchwrap svg{position:absolute; left:11px; top:34px; width:16px; height:16px; stroke:var(--muted)}

.toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px}
.count{font-size:14px; color:var(--muted)}
.count b{color:var(--green-800)}
.clearbtn{background:var(--green-050); border:1px solid var(--line); color:var(--green-800);
  padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer}
.clearbtn:hover{background:var(--green-100)}

/* Cards grid */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
.card{border:1px solid var(--line); border-radius:12px; padding:14px 15px; background:var(--white);
  transition:transform .12s ease, box-shadow .12s ease; position:relative; overflow:hidden}
.card:hover{transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--green-500)}
.card .top{display:flex; align-items:center; gap:8px; margin-bottom:9px; flex-wrap:wrap}
.chip{font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; letter-spacing:.3px}
.d-seg{background:#e3efff;color:#1e5aa8}.d-ter{background:#e7f6ec;color:#1f8a4c}
.d-qua{background:#fdf0e1;color:#b7791f}.d-qui{background:#f3e8fd;color:#7c3aed}
.d-sex{background:#ffe9ec;color:#c02b47}.d-sab{background:#e8eef0;color:#41606f}
.d-out{background:#eef0ef;color:#5d6d64}
.chip.course{background:var(--green-800); color:#fff}
.card h3{margin:0 0 3px; font-size:15.5px; font-weight:700; line-height:1.25; color:var(--ink)}
.card .turma{font-size:12px; color:var(--muted); margin-bottom:10px}
.meta{display:flex; flex-direction:column; gap:6px; font-size:13px}
.meta .row{display:flex; align-items:center; gap:8px}
.meta .ic{width:15px; height:15px; flex:0 0 15px; stroke:var(--green-600)}
.meta .prof{font-weight:600; color:var(--green-800); cursor:pointer; text-decoration:none}
.meta .prof:hover{text-decoration:underline}
.loc{color:var(--muted)}
.note{color:var(--amber); font-size:12px; line-height:1.35}
.empty{text-align:center; padding:60px 20px; color:var(--muted)}
.bldref{margin:0 0 16px; border:1px dashed var(--line); border-radius:10px; padding:0 14px; background:var(--green-050)}
.bldref summary{cursor:pointer; padding:11px 0; font-size:13px; font-weight:700; color:var(--green-800); list-style:none}
.bldref summary::-webkit-details-marker{display:none}
.bldref summary::before{content:"▸ "; color:var(--green-600)}
.bldref[open] summary::before{content:"▾ "}
.legend{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px; padding:4px 0 14px}
.legend .li{display:flex; align-items:baseline; gap:8px; font-size:12.5px}
.legend .bt{font-weight:700; color:var(--green-800); white-space:nowrap}
.legend .bc{color:var(--muted)}
.empty svg{width:44px;height:44px;stroke:var(--line);margin-bottom:10px}

/* Professors */
.plist-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px}
.plist-head h2{margin:0; font-size:19px; color:var(--green-800)}
.pgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px}
.pcard{display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:10px;
  padding:11px 13px; background:var(--white); cursor:pointer; transition:.12s}
.pcard:hover{border-color:var(--green-500); background:var(--green-050)}
.pav{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--green-100);
  color:var(--green-800);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.pcard .pn{font-size:14px;font-weight:600;line-height:1.2}
.pcard .pc{font-size:11.5px;color:var(--muted);margin-top:2px}
.pcard .parrow{margin-left:auto;color:var(--green-600);font-size:18px}

footer{max-width:1280px;margin:0 auto;padding:24px;color:var(--muted);font-size:12.5px;text-align:center}

@media(max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .filters{grid-template-columns:1fr 1fr}
  .filters .searchwrap{grid-column:1/-1}
}
@media(max-width:560px){
  .htext h1{font-size:17px}
  .stats{grid-template-columns:1fr 1fr}
  .filters{grid-template-columns:1fr}
  .tabs{overflow-x:auto}
}
</style>
</head>

const R = DATA.records;

// build professor -> class count
const profCount = {};
R.forEach(r=>{ if(r.professor){ profCount[r.professor]=(profCount[r.professor]||0)+1; }});

const DAYCLASS = {"Segunda":"d-seg","Terça":"d-ter","Quarta":"d-qua","Quinta":"d-qui","Sexta":"d-sex","Sábado":"d-sab"};
const DAYORDER = {"Segunda":1,"Terça":2,"Quarta":3,"Quinta":4,"Sexta":5,"Sábado":6,"EAD":7,"Conforme Calendário do Prof.":8,"Outros":9};
function dayClass(d){return DAYCLASS[d]||"d-out";}
function initials(n){const p=n.split(" ").filter(w=>w.length>2);return ((p[0]||n)[0]+(p[p.length-1]||"")[0]||"").toUpperCase();}

function uniq(arr){return [...new Set(arr)].filter(Boolean);}
function fillSelect(id,label,vals,sort=true){
  const s=document.getElementById(id);
  if(sort) vals=vals.sort((a,b)=>a.localeCompare(b,'pt'));
  s.innerHTML='<option value="">'+label+'</option>'+vals.map(v=>`<option value="${v.replace(/"/g,'&quot;')}">${v}</option>`).join('');
}

function initFilters(){
  fillSelect('f-course','Todos os cursos',uniq(R.map(r=>r.course)));
  fillSelect('f-shift','Todos',uniq(R.map(r=>r.shift)));
  const days=uniq(R.map(r=>r.day)).sort((a,b)=>(DAYORDER[a]||99)-(DAYORDER[b]||99));
  const s=document.getElementById('f-day');
  s.innerHTML='<option value="">Todos os dias</option>'+days.map(v=>`<option value="${v}">${v}</option>`).join('');
  fillSelect('f-building','Todos os prédios',uniq(R.map(r=>r.building)));
  fillSelect('f-prof','Todos os professores',DATA.professors.slice());
}

function renderStats(){
  const s=DATA.stats;
  const items=[["Cursos",s.n_courses],["Professores",s.n_professors],["Prédios / locais",s.n_buildings],["Aulas mapeadas",s.n_records]];
  document.getElementById('stats').innerHTML=items.map(([l,n])=>
    `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  document.getElementById('foot-meta').textContent=`${s.n_courses} cursos · ${s.n_professors} professores · ${s.n_records} aulas`;
}

function currentFilters(){
  return {
    q:document.getElementById('f-search').value.trim().toLowerCase(),
    course:document.getElementById('f-course').value,
    shift:document.getElementById('f-shift').value,
    day:document.getElementById('f-day').value,
    building:document.getElementById('f-building').value,
    prof:document.getElementById('f-prof').value,
  };
}

function render(){
  const f=currentFilters();
  let rows=R.filter(r=>{
    if(f.course && r.course!==f.course) return false;
    if(f.shift && r.shift!==f.shift) return false;
    if(f.day && r.day!==f.day) return false;
    if(f.building && r.building!==f.building) return false;
    if(f.prof && r.professor!==f.prof) return false;
    if(f.q){
      const hay=(r.subject+" "+r.professor+" "+r.room+" "+r.building_full+" "+r.turma+" "+r.course+" "+(r.info||"")).toLowerCase();
      if(!hay.includes(f.q)) return false;
    }
    return true;
  });
  rows.sort((a,b)=> a.course.localeCompare(b.course,'pt') || (DAYORDER[a.day]||99)-(DAYORDER[b.day]||99));
  document.getElementById('cnt').textContent=rows.length;
  const grid=document.getElementById('grid');
  if(rows.length===0){
    grid.innerHTML=`<div class="empty" style="grid-column:1/-1">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M3 3h18v18H3z"/><path d="M3 9h18M9 21V9"/></svg>
      <div>Nenhuma aula encontrada com esses filtros.</div></div>`;
    return;
  }
  grid.innerHTML=rows.map(r=>{
    const prof=r.professor? `<span class="prof" onclick="filterByProf('${r.professor.replace(/'/g,"\\'")}')">${r.professor}</span>` : '<span class="loc">—</span>';
    const room=r.room? r.room : '';
    const bld=r.building_full? r.building_full : (r.building||'');
    const locLine=[room,bld].filter(Boolean).join(' · ') || '<span style="color:#9aa8a0">Local a definir</span>';
    const infoLine=r.info? `<div class="row"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg><span class="note">${r.info}</span></div>` : '';
    return `<div class="card">
      <div class="top">
        <span class="chip ${dayClass(r.day)}">${r.day}</span>
        <span class="chip course">${r.course}</span>
      </div>
      <h3>${r.subject||'—'}</h3>
      <div class="turma">${r.turma||''} · ${r.shift}</div>
      <div class="meta">
        <div class="row"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>${prof}</div>
        <div class="row"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M15 9h.01M9 13h.01M15 13h.01M9 17h.01M15 17h.01"/></svg><span class="loc">${locLine}</span></div>
        ${infoLine}
      </div>
    </div>`;
  }).join('');
}

function clearFilters(){
  ['f-search','f-course','f-shift','f-day','f-building','f-prof'].forEach(id=>document.getElementById(id).value='');
  render();
}
function filterByProf(name){
  switchTab('grade');
  clearFilters();
  document.getElementById('f-prof').value=name;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* Professors tab */
function renderProfs(){
  const q=document.getElementById('p-search').value.trim().toLowerCase();
  let list=DATA.professors.filter(p=>p.toLowerCase().includes(q));
  document.getElementById('prof-title').textContent=`Professores da instituição (${list.length})`;
  const g=document.getElementById('pgrid');
  if(list.length===0){g.innerHTML='<div class="empty" style="grid-column:1/-1">Nenhum professor encontrado.</div>';return;}
  g.innerHTML=list.map(p=>{
    const c=profCount[p]||0;
    return `<div class="pcard" onclick="filterByProf('${p.replace(/'/g,"\\'")}')">
      <div class="pav">${initials(p)}</div>
      <div><div class="pn">${p}</div><div class="pc">${c} aula${c===1?'':'s'} na grade</div></div>
      <div class="parrow">›</div>
    </div>`;
  }).join('');
}

function switchTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  document.getElementById('tab-grade').style.display = t==='grade'?'':'none';
  document.getElementById('tab-profs').style.display = t==='profs'?'':'none';
}

function renderLegend(){
  const map={};
  R.forEach(r=>{ if(!r.building) return;
    map[r.building]=map[r.building]||new Set();
    if(r.complement) map[r.building].add(r.complement);
  });
  const order=["Prédio A","Prédio B","Prédio C","Prédio D","Bloco B","Bloco C","AVA / UNIVC (EAD)"];
  const keys=Object.keys(map).sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});
  document.getElementById('bldlegend').innerHTML=keys.map(k=>{
    const comps=[...map[k]];
    const txt=comps.length? comps.join(' · ') : (k.includes('AVA')?'Ensino a distância':'—');
    return `<div class="li"><span class="bt">${k}</span><span class="bc">${txt}</span></div>`;
  }).join('');
}

initFilters(); renderStats(); renderLegend(); render(); renderProfs();
</script>
